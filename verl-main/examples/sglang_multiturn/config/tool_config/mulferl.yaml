tools:
  - class_name: "verl.tools.mulferl_tool_feedback_group.MulFeRLTool"
    config:
      type: native
      api_model: "gpt-4o"
    tool_schema:
      type: "function"
      function:
        name: "calc_mulferl_feedback"
        description: "Generate structured verbal feedback for failed rollout groups. This tool does not compute rewards."
        parameters:
          type: "object"
          properties:
            question:
              type: "string"
              description: ""
            mode:
              type: "string"
              enum: ["group", "merge"]
              description: >
                'group' = inspect one or more failed solutions and give feedback;
                'merge' = merge multiple feedback strings into a final feedback.
            solutions:
              type: "array"
              items:
                type: "string"
              description: "List of candidate solutions for this question (used when mode='group')."
            feedbacks:
              type: "array"
              items:
                type: "string"
              description: "List of intermediate feedback strings (used when mode='merge')."
          required: ["question", "mode"]
